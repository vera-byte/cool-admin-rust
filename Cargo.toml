[workspace]
resolver = "2"
members = [
    # 基础库
    "crates/cool-proto",
    "crates/cool-core",
    "crates/cool-db",
    "crates/cool-func",
    "crates/cool-file",
    "crates/cool-micro",
    "crates/cool-tools",
    # 业务应用（模块 + 微服务 + proto + manifest）
    "apps/base",
    "apps/demo",
    "apps/dict",
    "apps/space",
    "apps/task",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cool-team-official/cool-admin-go"

[workspace.dependencies]
cool-proto = { path = "crates/cool-proto" }
cool-core = { path = "crates/cool-core" }
cool-db = { path = "crates/cool-db" }
cool-func = { path = "crates/cool-func" }
cool-file = { path = "crates/cool-file" }
cool-micro = { path = "crates/cool-micro" }
app-demo = { path = "apps/demo" }
app-base = { path = "apps/base" }
app-dict = { path = "apps/dict" }
app-space = { path = "apps/space" }
app-task = { path = "apps/task" }

tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
tonic-build = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"

sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "mysql",
    "chrono",
    "migrate",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
cron = "0.13"
sa-token-plugin-tonic = { git = "https://github.com/sa-tokens/sa-token-rust", package = "sa-token-plugin-tonic", default-features = false, features = ["tonic-012", "memory"] }
sa-token-core = { git = "https://github.com/sa-tokens/sa-token-rust", package = "sa-token-core" }
sa-token-storage-redis = { git = "https://github.com/sa-tokens/sa-token-rust", package = "sa-token-storage-redis" }
sa-token-adapter = { git = "https://github.com/sa-tokens/sa-token-rust", package = "sa-token-adapter" }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
config = "0.14"
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }

thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
