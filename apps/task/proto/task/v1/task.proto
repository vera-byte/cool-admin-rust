syntax = "proto3";

package task.v1;

import "common/v1/common.proto";

// 定时任务
service TaskInfoService {
  rpc Add(TaskAddReq) returns (TaskAddRes);
  rpc Delete(common.v1.IdsReq) returns (TaskDeleteRes);
  rpc Update(TaskUpdateReq) returns (TaskUpdateRes);
  rpc Info(common.v1.IdReq) returns (TaskInfoRes);
  rpc List(TaskListReq) returns (TaskListRes);
  rpc Page(TaskPageReq) returns (TaskPageRes);
  // 启用/停用/立即执行一次
  rpc Start(common.v1.IdReq) returns (TaskOpRes);
  rpc Stop(common.v1.IdReq) returns (TaskOpRes);
  rpc Once(common.v1.IdReq) returns (TaskOpRes);
  // 任务日志
  rpc Log(TaskLogReq) returns (TaskLogRes);
}

message TaskInfo {
  int64 id = 1;
  string job_id = 2;
  string repeat_conf = 3;
  string name = 4;
  string cron = 5;
  int32 limit = 6;
  int32 every = 7;
  string remark = 8;
  int32 status = 9;
  // unix 毫秒，0 表示空
  int64 start_date = 10;
  int64 end_date = 11;
  string data = 12;
  string service = 13;
  int32 type = 14;
  int64 next_run_time = 15;
  int32 task_type = 16;
  int64 create_time = 17;
  int64 update_time = 18;
}

message TaskAddReq {
  string name = 1;
  string cron = 2;
  string service = 3;
  string remark = 4;
  int32 status = 5;
  int32 type = 6;
  int32 task_type = 7;
  int32 every = 8;
  int64 start_date = 9;
  int64 end_date = 10;
  string data = 11;
}
message TaskAddRes {
  int32 code = 1;
  string message = 2;
  optional TaskInfo data = 3;
}
message TaskUpdateReq {
  int64 id = 1;
  optional string name = 2;
  optional string cron = 3;
  optional string service = 4;
  optional string remark = 5;
  optional int32 status = 6;
  optional int32 type = 7;
  optional int32 task_type = 8;
  optional int32 every = 9;
  optional int64 start_date = 10;
  optional int64 end_date = 11;
  optional string data = 12;
}
message TaskUpdateRes {
  int32 code = 1;
  string message = 2;
  int64 affected = 3;
}
message TaskDeleteRes {
  int32 code = 1;
  string message = 2;
  int64 affected = 3;
}
message TaskInfoRes {
  int32 code = 1;
  string message = 2;
  optional TaskInfo data = 3;
}
message TaskListReq {
  string keyword = 1;
  optional int32 status = 2;
}
message TaskListRes {
  int32 code = 1;
  string message = 2;
  repeated TaskInfo list = 3;
}
message TaskPageReq {
  int32 page = 1;
  int32 size = 2;
  string keyword = 3;
  optional int32 status = 4;
}
message TaskPageRes {
  int32 code = 1;
  string message = 2;
  int64 total = 3;
  repeated TaskInfo list = 4;
}
message TaskOpRes {
  int32 code = 1;
  string message = 2;
}

message TaskLogReq {
  optional int64 id = 1;
  optional int32 status = 2;
  int32 page = 3;
  int32 size = 4;
}
message TaskLogEntry {
  int64 id = 1;
  int64 task_id = 2;
  int32 status = 3;
  string detail = 4;
  int64 create_time = 5;
  string task_name = 6;
}
message TaskLogRes {
  int32 code = 1;
  string message = 2;
  int64 total = 3;
  repeated TaskLogEntry list = 4;
}
