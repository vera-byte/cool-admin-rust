# 微服务配置（base/dict/space/task 各自覆盖 service.*）
service:
  id: "space-service"
  name: "space"
  secret: "micro-secret-space-001"
  depends_on: []

server:
  address: "0.0.0.0:8003"
  reflection: true
  log_level: "info"

database:
  default:
    type: "mysql"
    host: "127.0.0.1"
    port: 3306
    user: "root"
    pass: "123456"
    name: "cooltest"

redis:
  address: "127.0.0.1:6379"
  db: 0

sa_token:
  token_name: "satoken"
  timeout: 3600
  key_prefix: "sa:"
  enable: true

cool:
  mode: "dev"
  autoMigrate: true
# APISIX 网关路由自动注册（按需开启）
apisix:
  enabled: false
  adminUrl: "http://127.0.0.1:9180"
  adminKey: "edd1c9f034335f136f87ad84b625c8f1"
  upstreamHost: "127.0.0.1"
  scheme: "grpc"
  prefix: "cool"
