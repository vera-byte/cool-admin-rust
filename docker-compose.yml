services:
  mysql:
    image: mysql:8
    container_name: cool-rust-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: cooltest
    ports:
      - "3306:3306"
    volumes:
      - cool_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: cool-rust-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- APISIX 网关 ----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: cool-rust-etcd
    environment:
      ETCD_NAME: etcd0
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_ADVERTISE_CLIENT_URLS: "http://cool-rust-etcd:2379"
      ETCD_LISTEN_PEER_URLS: "http://0.0.0.0:2380"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://cool-rust-etcd:2380"
      ETCD_INITIAL_CLUSTER: "etcd0=http://cool-rust-etcd:2380"
      ETCD_INITIAL_CLUSTER_TOKEN: "cool-etcd-cluster"
      ETCD_INITIAL_CLUSTER_STATE: "new"
    volumes:
      - cool_etcd_data:/etcd-data
    ports:
      - "2379:2379"
      - "2380:2380"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

  apisix:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/apisix:3.19.0-debian
    container_name: cool-rust-apisix
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./deploy/apisix.yaml:/usr/local/apisix/conf/config.yaml
    ports:
      - "9080:9080"    # HTTP / gRPC 代理
      - "9180:9180"    # Admin API
      - "9443:9443"    # HTTPS
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9080'"]
      interval: 5s
      timeout: 3s
      retries: 20

  apisix-dashboard:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/apisix-dashboard:3.0.1-alpine
    container_name: cool-rust-apisix-dashboard
    depends_on:
      apisix:
        condition: service_healthy
    volumes:
      - ./deploy/apisix-dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    ports:
      - "9000:9000"    # Dashboard Web UI

  # 可选：MinIO（file.mode=minio 时启用）
  # minio:
  #   image: minio/minio
  #   container_name: cool-rust-minio
  #   environment:
  #     MINIO_ROOT_USER: accessKeyID
  #     MINIO_ROOT_PASSWORD: secretAccessKey
  #   ports:
  #     - "9000:9000"
  #   command: server /data

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: cool-rust-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      COOL_REDIS__COOL__ADDRESS: "redis:6379"
      COOL_DATABASE__DEFAULT__HOST: "mysql"
    ports:
      - "8001:8001"
    volumes:
      - cool_public_data:/app/public

volumes:
  cool_mysql_data:
  cool_etcd_data:
  cool_public_data:
