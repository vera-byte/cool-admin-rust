apisix:
  node_listen: 9080
  enable_admin: true

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - "http://cool-rust-etcd:2379"
    prefix: "/apisix"
    timeout: 30
  admin:
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
    allow_admin:
      - 0.0.0.0/0
    admin_listen:
      ip: 0.0.0.0
      port: 9180

# 服务发现配置
discovery:
  nacos:
    host:
      - "http://cool-nacos:8848"
    prefix: "/nacos/v1"
    fetch_interval: 30    # 拉取实例间隔（秒）
    service_name: "DEFAULT_GROUP@@"
    group_name: "DEFAULT_GROUP"
    namespace_id: ""

plugins:
  - prometheus
  - grpc-transcode
  - grpc-web
  - proxy-rewrite
  - limit-count
  - cors

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
