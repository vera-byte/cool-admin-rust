# AlertManager 通知配置
global:
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@example.com"

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical
    - match:
        severity: warning
      receiver: warning

receivers:
  - name: default
    webhook_configs:
      - url: "http://localhost:9099/alerts"

  - name: critical
    email_configs:
      - to: "ops@example.com"
        subject: "[P0] {{ .GroupLabels.alertname }}"
        body: "{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}"
    webhook_configs:
      - url: "http://alert-relay:8080/critical"

  - name: warning
    webhook_configs:
      - url: "http://alert-relay:8080/warning"
